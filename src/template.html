<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src https: http:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Watch-only">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a5f69">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Watch-only Wallet</title>
<style>
:root {
  --grund: #eceee9;
  --flaeche: #fbfbf8;
  --tinte: #17222b;
  --gedaempft: #5b6670;
  --blass: #a3aba7;
  --linie: #d3d7d0;
  --leiste: #0a5f69;
  --leiste-dunkel: #084a52;
  --akzent: #0a6f7b;
  --akzent-hell: #dff0f1;
  --ein: #0f7b4f;
  --aus: #b3361f;
  --offen: #8a6100;
  --offen-hell: #f6edd6;
  --fehler-hell: #f8e3de;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  color: var(--tinte);
  background: var(--grund);
  font-variant-numeric: tabular-nums;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--akzent); }
:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 0.92em; }

/* Grundlayout */
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.seite { background: var(--leiste); color: #fff; padding: calc(22px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 18px; }
.marke { padding: 0 6px; }
.marke strong { display: block; font-size: 17px; letter-spacing: 0.01em; }
.marke span { color: #c4dfe2; font-size: 13px; }
.wallets { display: flex; flex-direction: column; gap: 2px; }
.wallet-knopf {
  all: unset; cursor: pointer; display: block; padding: 9px 10px; border-radius: 5px;
}
.wallet-knopf:hover { background: rgba(255,255,255,0.06); }
.wallet-knopf[aria-current="true"] { background: rgba(255,255,255,0.16); }
.wallet-knopf:focus-visible { outline: 2px solid #fff; }
.wallet-knopf b { display: block; font-weight: 600; font-size: 14px; }
.wallet-knopf small { color: #c4dfe2; font-size: 12.5px; }
.seite-aktionen { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.seite .knopf { background: transparent; color: #fff; border-color: rgba(255,255,255,0.35); width: 100%; justify-content: flex-start; }
.seite .knopf:hover { background: rgba(255,255,255,0.06); }
.seite .knopf.primaer { background: var(--leiste-dunkel); border-color: var(--leiste-dunkel); }
.seite :focus-visible { outline-color: #fff; }

.haupt { padding: 30px 40px calc(60px + env(safe-area-inset-bottom)); max-width: 1060px; width: 100%; }

/* Kopfleiste auf dem Handy (ersetzt die Seitenleiste) */
.handy-leiste { display: none; }

/* Knöpfe */
.knopf {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 5px;
  border: 1px solid var(--linie); background: var(--flaeche); cursor: pointer; font-size: 14px; line-height: 1.3;
}
.knopf:hover { border-color: var(--blass); }
.knopf.primaer { background: var(--akzent); border-color: var(--akzent); color: #fff; }
.knopf.primaer:hover { background: #085a64; }
.knopf.gefahr { color: var(--aus); }
.knopf.gefahr.scharf { background: var(--aus); border-color: var(--aus); color: #fff; }
.knopf:disabled { opacity: 0.55; cursor: default; }
.knopf.klein { padding: 3px 9px; font-size: 13px; }

/* Kopf mit Saldo */
.kopf { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 24px; align-items: end; padding-bottom: 22px; border-bottom: 1px solid var(--linie); }
.kopf h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.005em; }
.kopf .typ { color: var(--gedaempft); font-size: 14px; }
.saldo { grid-column: 1 / -1; display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; }
.saldo .betrag-gross { font-size: clamp(36px, 5.4vw, 56px); font-weight: 300; letter-spacing: -0.02em; line-height: 1.05; }
.saldo .einheit { font-size: 0.4em; font-weight: 500; color: var(--gedaempft); margin-left: 0.25em; letter-spacing: 0; }
.saldo .chf { color: var(--gedaempft); font-size: 17px; }
.dim { color: var(--blass); }
.offen-zeile { grid-column: 1 / -1; color: var(--offen); font-size: 14px; }
.status-zeile > span { min-width: 0; flex: 1 1 220px; }
.status-zeile { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; color: var(--gedaempft); font-size: 13px; margin-top: 4px; }
.umschalter { display: inline-flex; border: 1px solid var(--linie); border-radius: 5px; overflow: hidden; align-self: center; }
.umschalter button { all: unset; cursor: pointer; padding: 4px 10px; font-size: 13px; color: var(--gedaempft); }
.umschalter button[aria-pressed="true"] { background: var(--tinte); color: #fff; }
.umschalter button:focus-visible { outline: 2px solid var(--akzent); outline-offset: -2px; }

/* Reiter */
.reiter { display: flex; gap: 2px; margin: 18px 0 20px; border-bottom: 1px solid var(--linie); overflow-x: auto; }
.reiter button {
  all: unset; cursor: pointer; padding: 9px 14px; font-size: 14.5px; color: var(--gedaempft);
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
}
.reiter button[aria-selected="true"] { color: var(--tinte); border-bottom-color: var(--tinte); font-weight: 600; }
.reiter button:focus-visible { outline: 2px solid var(--akzent); outline-offset: -2px; }
.reiter .zahl { color: var(--blass); font-weight: 400; margin-left: 4px; }

/* Tabellen */
.tabelle { overflow-x: auto; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 6px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--linie); vertical-align: top; font-size: 14px; }
th { font-weight: 600; color: var(--gedaempft); font-size: 13px; background: #f3f4f0; }
tr:last-child td { border-bottom: none; }
td.zahl, th.zahl { text-align: right; white-space: nowrap; }
tr.klickbar { cursor: pointer; }
tr.klickbar:hover td { background: #f1f6f6; }
tr.gewaehlt td { background: var(--akzent-hell); }
tr.leer td { color: var(--blass); }
.ein { color: var(--ein); }
.aus { color: var(--aus); }
.marke-tx { display: inline-block; font-size: 12.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; }
.marke-tx.offen { color: var(--offen); background: var(--offen-hell); border-color: transparent; }

/* Fingerprint-Marken für Mitsignierende */
.fp { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 12.5px; padding: 1px 8px 1px 6px; border-radius: 999px; background: color-mix(in srgb, var(--fp) 12%, white); color: var(--fp); white-space: nowrap; }
.fp::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--fp); }

/* Pfad-Zerlegung */
.pfad { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; margin: 6px 0 4px; }
.pfad .stufe { display: flex; flex-direction: column; padding: 6px 12px 7px; border: 1px solid var(--linie); background: var(--flaeche); margin-left: -1px; min-width: 76px; }
.pfad .stufe:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.pfad .stufe:last-child { border-radius: 0 6px 6px 0; }
.pfad .stufe b { font-family: var(--mono); font-size: 16px; font-weight: 600; }
.pfad .stufe span { font-size: 12.5px; color: var(--gedaempft); line-height: 1.3; }
.pfad .stufe small { font-size: 12px; color: var(--blass); line-height: 1.3; }
.pfad .stufe.privat { background: #eef0ec; }
.pfad .stufe.privat b { color: var(--gedaempft); }
.pfad .xpub-grenze { display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0 8px; margin-left: -1px; background: var(--tinte); color: #fff; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; writing-mode: vertical-rl; transform: rotate(180deg); min-height: 64px; }
.pfad-legende { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px; color: var(--gedaempft); margin-top: 6px; }
.pfad-legende i { display: inline-block; width: 12px; height: 12px; border: 1px solid var(--linie); vertical-align: -2px; margin-right: 6px; }

/* Flächen */
.feld { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 6px; padding: 18px 20px; }
.feld + .feld { margin-top: 16px; }
.feld h2 { font-size: 16px; margin: 0 0 10px; }
.feld h3 { font-size: 14.5px; margin: 16px 0 6px; }
.hinweis { color: var(--gedaempft); font-size: 13.5px; }
.meldung { padding: 10px 14px; border-radius: 6px; font-size: 14px; margin: 0 0 16px; }
.meldung.fehler { background: var(--fehler-hell); color: #7d2414; }
.meldung.info { background: var(--akzent-hell); color: #0b4a52; }
.meldung.warn { background: var(--offen-hell); color: #5e4300; }

/* Empfangen */
.empfang { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 26px; align-items: start; }
.qr { background: #fff; border: 1px solid var(--linie); border-radius: 6px; padding: 12px; }
.qr svg { display: block; width: 100%; height: auto; }
.adresse-gross { font-family: var(--mono); font-size: 19px; line-height: 1.7; display: flex; flex-wrap: wrap; gap: 0 10px; word-break: break-all; }
.adresse-gross span:nth-child(even) { color: var(--gedaempft); }
.index-zeile { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 14px 0; }

/* Formulare */
label.titel { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 5px; }
input[type=text], input[type=url], input[type=number], select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--linie); border-radius: 5px; background: #fff;
}
textarea { font-family: var(--mono); font-size: 13px; min-height: 120px; resize: vertical; }
.zeile { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
.vorschau { margin-top: 14px; border-top: 1px solid var(--linie); padding-top: 12px; }
.vorschau dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; margin: 0; font-size: 14px; }
.vorschau dt { color: var(--gedaempft); }
.vorschau dd { margin: 0; }
.kurz { overflow-wrap: anywhere; }
.descriptor { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; background: #f3f4f0; border-radius: 5px; padding: 10px 12px; }

.willkommen { max-width: 640px; }
.willkommen h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; margin: 20px 0 8px; }
.willkommen p { font-size: 16px; color: var(--gedaempft); }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .seite { display: none; }
  .handy-leiste {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center;
    position: sticky; top: 0; z-index: 10; background: var(--leiste); color: #fff;
    padding: calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 10px calc(12px + env(safe-area-inset-left));
  }
  .handy-leiste select {
    background: var(--leiste-dunkel); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px;
    padding: 8px 10px; font-size: 16px; min-width: 0; width: 100%;
  }
  .handy-leiste .titel-klein { font-weight: 600; font-size: 16px; }
  .handy-leiste .knopf { background: transparent; color: #fff; border-color: rgba(255,255,255,0.35); padding: 8px 11px; font-size: 15px; }
  .handy-leiste :focus-visible { outline-color: #fff; }
  .haupt { padding: 18px calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left)); }
  .kopf { grid-template-columns: minmax(0, 1fr); }
  .umschalter { justify-self: start; }
  .empfang { grid-template-columns: 1fr; }
  .qr { max-width: 260px; }
  .adresse-gross { font-size: 17px; }
  .nur-breit { display: none; }
  input[type=text], input[type=url], input[type=number], select, textarea { font-size: 16px; }
  /* Ableitungspfad untereinander statt nebeneinander */
  .pfad { flex-direction: column; }
  .pfad .stufe { flex-direction: row; align-items: baseline; gap: 10px; margin-left: 0; margin-top: -1px; min-width: 0; padding: 6px 12px; }
  .pfad .stufe:first-child { border-radius: 6px 6px 0 0; margin-top: 0; }
  .pfad .stufe:last-child { border-radius: 0 0 6px 6px; }
  .pfad .stufe b { min-width: 34px; }
  .pfad .xpub-grenze { writing-mode: horizontal-tb; transform: none; min-height: 0; margin-left: 0; margin-top: -1px; padding: 4px 12px; align-items: flex-start; }
}
</style>
</head>
<body>
<div id="app"></div>
<noscript>Diese App braucht JavaScript.</noscript>
<script>/*APP*/</script>
</body>
</html>
